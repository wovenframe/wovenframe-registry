name: validate

on:
  pull_request:
    paths:
      - "templates.json"
  push:
    branches: [main]
    paths:
      - "templates.json"
      - "scripts/validate.mjs"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate templates.json
        run: node scripts/validate.mjs
