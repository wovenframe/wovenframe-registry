name: sync-stars

on:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-stars
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync stars / downloads from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync.mjs

      - name: Commit changes
        run: |
          git config user.name "wovenframe-bot"
          git config user.email "wovenframe-bot@users.noreply.github.com"
          git add templates.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: sync stars/downloads"
            git push
          fi
